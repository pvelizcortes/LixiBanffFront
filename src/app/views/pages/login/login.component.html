<c-row class="min-vh-100">
  <div class="col-sm-8 login-background">
    &nbsp;
  </div>
  <div class="col-sm-4">
    <c-card-group>
      <c-card class="p-4" style="border:none" >
        <c-card-body>
          <form cForm (ngSubmit)="onSubmit(loginForm.value)" [formGroup]="loginForm">
            <img src="assets/img/brand/lixitrack.png" style="width: 30%;" />
            <p class="text-medium-emphasis">Ingrese con su usuario y contraseña.</p>
            <c-input-group class="mb-3">
              <span cInputGroupText>
                <svg cIcon name="cilUser"></svg>
              </span>
              <input autoComplete="username" cFormControl placeholder="Usuario" formControlName="userName" />
            </c-input-group>
            <c-input-group class="mb-4">
              <span cInputGroupText>
                <svg cIcon name="cilLockLocked"></svg>
              </span>
              <input autoComplete="current-password" cFormControl placeholder="Contraseña" type="password" required
                formControlName="password" />
            </c-input-group>
            <c-row>
              <c-col class="text-right" xs="6">
                <br>
                <button cButton class="px-4" color="warning" type="submit">
                  Ingresar
                </button>
              </c-col>
            </c-row>
          </form>
        </c-card-body>
      </c-card>
    </c-card-group>
  </div>
</c-row>
