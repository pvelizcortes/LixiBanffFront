<!--sidebar-->
<c-sidebar #sidebar="cSidebar" class="d-print-none sidebar sidebar-fixed" id="sidebar" visible narrow="true"
  unfoldable="true" colorScheme="light">
  <c-sidebar-brand [brandFull]="{
      src: 'assets/img/brand/lixitrack.png',
      width: 200,
      height: 46,
      alt: 'LixiBanff'
    }" [brandNarrow]="{
      src: 'assets/img/brand/brandIcon.png',
      width: 46,
      height: 46,
      alt: 'LixiBanff'
    }" routerLink="./">
  </c-sidebar-brand>
  <perfect-scrollbar [config]="perfectScrollbarConfig">
    <!--  [perfectScrollbar]="perfectScrollbarConfig"-->
    <c-sidebar-nav [navItems]="navItemsForShow">
    </c-sidebar-nav>
  </perfect-scrollbar>
  <c-sidebar-toggler *ngIf="!sidebar.narrow" toggle="unfoldable" cSidebarToggle="sidebar"></c-sidebar-toggler>
</c-sidebar>

<!--main-->
<div class="wrapper d-flex flex-column min-vh-100 dark:bg-transparent">
  <!--app-header-->
  <app-default-header class="d-print-none header header-sticky" position="sticky"
    sidebarId="sidebar"></app-default-header>
  <!--app-body-->
  <div class="body flex-grow-1 px-2 py-0">
      <router-outlet></router-outlet>  
  </div>
  <!--app footer-->
  <div *ngIf="spinnerService.visibility | async">
    <div class="loading">Loading&#8230;</div>       
  </div>
  <app-default-footer></app-default-footer>
</div>
